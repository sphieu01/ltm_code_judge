services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ltm-code-judge-server:latest
    container_name: ltm-server
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      - DB_URL=jdbc:postgresql://ep-dry-rice-b32otp6l-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - DB_USER=neondb_owner
      - DB_PASSWORD=npg_GAm7Pd6hCFMt
      - SERVER_PORT=9999
      - CONNECTION_POOL_SIZE=20
      - JUDGE_WORKER_COUNT=4
      - JWT_SECRET=MyVerySecretKeyForCodeGradingSystem2024!ThisIsLong
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=ltm-submissions
    depends_on:
      - minio
    volumes:
      - server_temp:/app/temp

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: ltm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data

volumes:
  server_temp:
  minio_data:
